[package]
name = "voice-assistant"
version = "1.0.0"
description = "Voice assistant with speech-to-text and conversational AI capabilities"
authors = ["Your Name"]
license = "MIT"
edition = "2021"

[features]
default = []
audio = ["cpal", "rodio"]

[dependencies]
tauri = { version = "2.5.5", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = { version = "2.3.2" }
tauri-plugin-global-shortcut = { version = "2.0.0" }
tauri-plugin-notification = { version = "2.0.0" }
tauri-plugin-shell = { version = "2.0.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
dirs = "5.0"

# Audio dependencies (optional, enabled via feature flag)
cpal = { version = "0.15", optional = true }
rodio = { version = "0.17", optional = true }

# Clipboard dependencies
arboard = "3.3"

# Keyboard simulation
enigo = "0.3"

# Global hotkeys
global-hotkey = "0.2"

# Database
rusqlite = "0.29"

# System info
sysinfo = "0.30"

# HTTP client
reqwest = { version = "0.11", features = ["json", "blocking"] }

# Base64 encoding
base64 = "0.21"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.10"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Command line parsing
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
proptest = "1.4"
tempfile = "3.8"

[build-dependencies]
tauri-build = "2.5.5"
