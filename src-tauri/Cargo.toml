[package]
name = "voice-assistant"
version = "1.0.0"
description = "Voice assistant with speech-to-text and conversational AI capabilities"
authors = ["Your Name"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tauri = "2.5.5"
tauri-plugin-clipboard-manager = { version = "2.3.2" }
tauri-plugin-global-shortcut = { version = "2.0.0" }
tauri-plugin-notification = { version = "2.0.0" }
tauri-plugin-shell = { version = "2.0.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
dirs = "5.0"

# Audio dependencies (temporarily disabled due to ALSA installation issues)
# cpal = "0.15"
# rodio = "0.17"

# Clipboard dependencies
arboard = "3.3"

# Keyboard simulation
enigo = "0.1.3"

# Global hotkeys
global-hotkey = "0.2"

# Database
rusqlite = "0.29"

# System info
sysinfo = "0.30"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Time
chrono = "0.4"

# Logging
log = "0.4"
env_logger = "0.10"

# Audio processing (temporarily disabled)
# hound = "3.5"

# Command line parsing
clap = { version = "4.4", features = ["derive"] }

[build-dependencies]
tauri-build = "2.5.5"
